<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭記帳本 - Google Sheets 同步版</title>
    <!-- 自動載入同資料夾下的設定檔 -->
    <script src="config.js"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --text-muted: #6B7280;
            --border: #E5E7EB;
            --expense: #EF4444;
            --income: #10B981;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        header p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="number"], input[type="date"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 11px 16px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:active {
            transform: scale(0.98);
        }

        button.btn-secondary {
            background: #9CA3AF;
        }

        button.btn-danger {
            background: #DC2626;
        }

        /* Member & Category Pills */
        .pill-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pill {
            padding: 8px 14px;
            border-radius: 20px;
            background: #F3F4F6;
            border: 1px solid var(--border);
            font-size: 0.875rem;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }

        .pill.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Type Toggle */
        .type-toggle {
            display: flex;
            background: #F3F4F6;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 14px;
        }

        .type-btn {
            flex: 1;
            padding: 8px;
            text-align: center;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
        }

        .type-btn.active-expense {
            background: var(--expense);
            color: white;
        }

        .type-btn.active-income {
            background: var(--income);
            color: white;
        }

        /* Status Badge */
        .status-badge {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: normal;
        }
        .status-badge.online {
            background: #D1FAE5;
            color: #065F46;
        }
        .status-badge.offline {
            background: #FEE2E2;
            color: #991B1B;
        }

        /* Summary Grid */
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .summary-card {
            background: #F9FAFB;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .summary-card h4 {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .summary-card div {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .record-item:last-child {
            border-bottom: none;
        }

        .record-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .record-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .record-tags {
            display: flex;
            gap: 6px;
            font-size: 0.75rem;
            align-items: center;
        }

        .tag {
            background: #E5E7EB;
            padding: 2px 6px;
            border-radius: 4px;
            color: #4B5563;
        }

        .sync-tag {
            font-size: 0.7rem;
        }

        .record-amount {
            font-size: 1rem;
            font-weight: bold;
        }

        .record-amount.expense {
            color: var(--expense);
        }

        .record-amount.income {
            color: var(--income);
        }

        .delete-btn {
            background: none;
            color: #9CA3AF;
            font-size: 1.1rem;
            padding: 4px 8px;
            cursor: pointer;
        }

        .delete-btn:hover {
            color: var(--expense);
        }
    </style>
</head>
<body>

    <header>
        <h1>👨‍👩‍👧‍👧 家庭快速記帳本</h1>
        <p>快捷成員標籤 + Google Sheets 即時同步</p>
    </header>

    <!-- Google Sheet 狀態卡片 -->
    <div class="card">
        <div class="card-title">
            <span>📊 Google Sheet 同步狀態</span>
            <span id="sheet-status" class="status-badge offline">檢查設定中...</span>
        </div>
        <p style="font-size: 0.8rem; color: var(--text-muted);" id="config-tip">
            讀取自 <code>finance/config.js</code> 檔案設定
        </p>
    </div>

    <!-- 記帳表單 -->
    <div class="card">
        <div class="card-title">📝 快速輸入</div>

        <div class="type-toggle">
            <div class="type-btn active-expense" id="btn-expense" onclick="setType('expense')">💸 支出</div>
            <div class="type-btn" id="btn-income" onclick="setType('income')">💰 收入</div>
        </div>

        <!-- 成員標籤 -->
        <div class="form-group">
            <label>👨‍👩‍👧 歸屬家庭成員</label>
            <div class="pill-group" id="member-pills">
                <div class="pill active" onclick="selectMember('爸爸', this)">👨 爸爸</div>
                <div class="pill" onclick="selectMember('媽媽', this)">👩 媽媽</div>
                <div class="pill" onclick="selectMember('大女兒', this)">👧 大女兒</div>
                <div class="pill" onclick="selectMember('小女兒', this)">👶 小女兒</div>
                <div class="pill" onclick="selectMember('全家', this)">🏠 全家共享</div>
            </div>
        </div>

        <!-- 類別標籤 -->
        <div class="form-group">
            <label>🏷️ 支出 / 收入類別</label>
            <div class="pill-group" id="category-pills">
                <div class="pill active" onclick="selectCategory('餐飲', this)">🍎 餐飲</div>
                <div class="pill" onclick="selectCategory('教育文具', this)">🎒 教育文具</div>
                <div class="pill" onclick="selectCategory('娛樂玩具', this)">🧸 娛樂玩具</div>
                <div class="pill" onclick="selectCategory('日常用品', this)">🛒 日常用品</div>
                <div class="pill" onclick="selectCategory('醫療健康', this)">🏥 醫療健康</div>
                <div class="pill" onclick="selectCategory('交通出行', this)">🚗 交通出行</div>
                <div class="pill" onclick="selectCategory('其他', this)">📦 其他</div>
            </div>
        </div>

        <!-- 金額 -->
        <div class="form-group">
            <label for="input-amount">金額 ($)</label>
            <input type="number" id="input-amount" placeholder="0" step="any" inputmode="decimal">
        </div>

        <!-- 說明 -->
        <div class="form-group">
            <label for="input-merchant">商家 / 項目說明</label>
            <input type="text" id="input-merchant" placeholder="例如：早餐 / 學校教材費用">
        </div>

        <!-- 日期 -->
        <div class="form-group">
            <label for="input-date">日期</label>
            <input type="date" id="input-date">
        </div>

        <button id="submit-btn" style="width: 100%; margin-top: 8px;" onclick="addRecord()">➕ 記一筆並同步</button>
    </div>

    <!-- 本月統計 -->
    <div class="card">
        <div class="card-title">
            <span>📈 本月統計摘要</span>
            <button class="btn-secondary" style="font-size: 0.75rem; padding: 4px 8px;" onclick="exportCSV()">📥 匯出 CSV</button>
        </div>
        <div class="summary-grid">
            <div class="summary-card">
                <h4>總支出</h4>
                <div id="total-expense" style="color: var(--expense);">$0</div>
            </div>
            <div class="summary-card">
                <h4>總收入</h4>
                <div id="total-income" style="color: var(--income);">$0</div>
            </div>
        </div>

        <div class="form-group">
            <label>👨‍👩‍👧‍👧 成員消費分布</label>
            <div id="member-breakdown" style="font-size: 0.85rem; color: var(--text-muted);">尚無數據</div>
        </div>
    </div>

    <!-- 明細列表 -->
    <div class="card">
        <div class="card-title">
            <span>📋 最近記帳明細</span>
            <button class="btn-danger" style="font-size: 0.75rem; padding: 4px 8px;" onclick="clearAllRecords()">清空紀錄</button>
        </div>
        <div id="records-list"></div>
    </div>

    <script>
        let currentType = 'expense';
        let currentMember = '爸爸';
        let currentCategory = '餐飲';
        let records = JSON.parse(localStorage.getItem('family_records') || '[]');

        window.onload = function() {
            document.getElementById('input-date').valueAsDate = new Date();
            
            // 檢查 config.js
            const statusEl = document.getElementById('sheet-status');
            const tipEl = document.getElementById('config-tip');

            if (typeof CONFIG !== 'undefined' && CONFIG.gasUrl && CONFIG.gasUrl.includes('script.google.com')) {
                statusEl.className = 'status-badge online';
                statusEl.innerText = '✅ GAS 已連線';
                tipEl.innerText = '已載入 Google Apps Script 連線檔';
            } else {
                statusEl.className = 'status-badge offline';
                statusEl.innerText = '⚠️ 未設定 GAS 網址';
                tipEl.innerText = '請在 finance/config.js 中填入您的 Google Apps Script 部署 URL。';
            }

            renderRecords();
        };

        function setType(type) {
            currentType = type;
            document.getElementById('btn-expense').className = type === 'expense' ? 'type-btn active-expense' : 'type-btn';
            document.getElementById('btn-income').className = type === 'income' ? 'type-btn active-income' : 'type-btn';
        }

        function selectMember(member, element) {
            currentMember = member;
            document.querySelectorAll('#member-pills .pill').forEach(p => p.classList.remove('active'));
            element.classList.add('active');
        }

        function selectCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('#category-pills .pill').forEach(p => p.classList.remove('active'));
            element.classList.add('active');
        }

        async function addRecord() {
            const amount = parseFloat(document.getElementById('input-amount').value);
            const merchant = document.getElementById('input-merchant').value.trim() || '無備註';
            const date = document.getElementById('input-date').value;

            if (!amount || isNaN(amount)) {
                alert('請輸入有效金額！');
                return;
            }

            const record = {
                id: Date.now(),
                type: currentType,
                member: currentMember,
                category: currentCategory,
                amount: amount,
                merchant: merchant,
                date: date,
                synced: false
            };

            // 1. 立即存入瀏覽器本機 (畫面反應零延遲)
            records.unshift(record);
            saveRecords();
            renderRecords();

            // 重置輸入欄位
            document.getElementById('input-amount').value = '';
            document.getElementById('input-merchant').value = '';

            // 2. 後台背景同步至 Google Sheets
            syncToGoogleSheet(record);
        }

        async function syncToGoogleSheet(record) {
            if (typeof CONFIG === 'undefined' || !CONFIG.gasUrl || CONFIG.gasUrl.includes('YOUR_GAS_WEB_APP_URL')) {
                console.log('未設定有效 GAS URL，僅在本地儲存。');
                return;
            }

            try {
                await fetch(CONFIG.gasUrl, {
                    method: 'POST',
                    mode: 'no-cors', // 避免跨網域預檢阻擋
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(record)
                });

                // 標記為已同步
                const target = records.find(r => r.id === record.id);
                if (target) {
                    target.synced = true;
                    saveRecords();
                    renderRecords();
                }
            } catch (err) {
                console.error('同步至 Google Sheet 失敗:', err);
            }
        }

        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            saveRecords();
            renderRecords();
        }

        function clearAllRecords() {
            if (confirm('確定要清空本機所有紀錄嗎？（不影響已同步至 Google Sheet 的試算表）')) {
                records = [];
                saveRecords();
                renderRecords();
            }
        }

        function saveRecords() {
            localStorage.setItem('family_records', JSON.stringify(records));
        }

        function renderRecords() {
            const listEl = document.getElementById('records-list');
            listEl.innerHTML = '';

            let totalExp = 0, totalInc = 0;
            const memberExp = {};

            if (records.length === 0) {
                listEl.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">尚無紀錄，現在開始新增吧！</div>';
            }

            records.forEach(r => {
                if (r.type === 'expense') {
                    totalExp += r.amount;
                    memberExp[r.member] = (memberExp[r.member] || 0) + r.amount;
                } else {
                    totalInc += r.amount;
                }

                const item = document.createElement('div');
                item.className = 'record-item';
                const syncTag = r.synced ? '🟢 已同步' : '⏳ 本機儲存';

                item.innerHTML = `
                    <div class="record-info">
                        <div class="record-title">${escapeHtml(r.merchant)}</div>
                        <div class="record-tags">
                            <span class="tag">${r.date}</span>
                            <span class="tag">👤 ${r.member}</span>
                            <span class="tag">🏷️ ${r.category}</span>
                            <span class="sync-tag">${syncTag}</span>
                        </div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="record-amount ${r.type}">${r.type === 'expense' ? '-' : '+'}$${r.amount.toLocaleString()}</span>
                        <button class="delete-btn" onclick="deleteRecord(${r.id})">🗑️</button>
                    </div>
                `;
                listEl.appendChild(item);
            });

            document.getElementById('total-expense').innerText = `$${totalExp.toLocaleString()}`;
            document.getElementById('total-income').innerText = `$${totalInc.toLocaleString()}`;

            const breakdownEl = document.getElementById('member-breakdown');
            if (Object.keys(memberExp).length === 0) {
                breakdownEl.innerText = '尚無支出數據';
            } else {
                let html = '<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px;">';
                for (const [member, amt] of Object.entries(memberExp)) {
                    const percent = totalExp > 0 ? Math.round((amt / totalExp) * 100) : 0;
                    html += `<div style="background:#F3F4F6; padding: 4px 8px; border-radius: 6px;">${member}: <b>$${amt.toLocaleString()}</b> (${percent}%)</div>`;
                }
                html += '</div>';
                breakdownEl.innerHTML = html;
            }
        }

        function exportCSV() {
            if (records.length === 0) return alert('沒有紀錄可供匯出！');
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF日期,類型,歸屬成員,類別,商家/項目,金額\n";
            records.forEach(r => {
                csvContent += `"${r.date}","${r.type === 'expense' ? '支出' : '收入'}","${r.member}","${r.category}","${r.merchant.replace(/"/g, '""')}",${r.amount}\n`;
            });
            const link = document.createElement("a");
            link.href = encodeURI(csvContent);
            link.download = `家庭記帳備份_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
