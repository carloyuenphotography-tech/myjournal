<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭智能記帳本 - Gemini AI 驅動</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --text-muted: #6B7280;
            --border: #E5E7EB;
            --expense: #EF4444;
            --income: #10B981;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        header p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* API Key Section */
        .api-key-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"], input[type="number"], input[type="date"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus, input[type="date"]:focus, select:focus {
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:active {
            transform: scale(0.98);
        }

        button.btn-secondary {
            background: #9CA3AF;
        }

        button.btn-danger {
            background: #DC2626;
        }

        /* Camera / File Upload Box */
        .upload-box {
            border: 2px dashed #C7D2FE;
            background: #EEF2FF;
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
        }

        .upload-box:hover {
            background: #E0E7FF;
            border-color: var(--primary);
        }

        .upload-box .icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .upload-box p {
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: 600;
        }

        .upload-box span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        /* Member & Category Pills */
        .pill-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pill {
            padding: 8px 14px;
            border-radius: 20px;
            background: #F3F4F6;
            border: 1px solid var(--border);
            font-size: 0.875rem;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }

        .pill.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Type Toggle (Expense / Income) */
        .type-toggle {
            display: flex;
            background: #F3F4F6;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 14px;
        }

        .type-btn {
            flex: 1;
            padding: 8px;
            text-align: center;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
        }

        .type-btn.active-expense {
            background: var(--expense);
            color: white;
        }

        .type-btn.active-income {
            background: var(--income);
            color: white;
        }

        /* Loading Spinner */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            justify-content: center;
            align-items: center;
            color: white;
            flex-direction: column;
            gap: 12px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Summary & List */
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .summary-card {
            background: #F9FAFB;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .summary-card h4 {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .summary-card div {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .record-item:last-child {
            border-bottom: none;
        }

        .record-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .record-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .record-tags {
            display: flex;
            gap: 6px;
            font-size: 0.75rem;
        }

        .tag {
            background: #E5E7EB;
            padding: 2px 6px;
            border-radius: 4px;
            color: #4B5563;
        }

        .record-amount {
            font-size: 1rem;
            font-weight: bold;
        }

        .record-amount.expense {
            color: var(--expense);
        }

        .record-amount.income {
            color: var(--income);
        }

        .delete-btn {
            background: none;
            color: #9CA3AF;
            font-size: 1.1rem;
            padding: 4px 8px;
            cursor: pointer;
        }

        .delete-btn:hover {
            color: var(--expense);
        }

        .preview-img {
            max-width: 100%;
            max-height: 180px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <header>
        <h1>👨‍👩‍👧‍👧 家庭智能記帳本</h1>
        <p>相機快照 + Gemini AI 自動識別 + 成員標籤</p>
    </header>

    <!-- API Key 設定 -->
    <div class="card">
        <div class="card-title">
            <span>🔑 Gemini API 金鑰設定</span>
            <span id="api-status" style="font-size: 0.75rem; font-weight: normal; color: var(--text-muted);">尚未儲存</span>
        </div>
        <div class="api-key-group">
            <input type="text" id="api-key" placeholder="貼上您的 Gemini API Key (AIzaSy...)" />
            <button onclick="saveApiKey()">儲存</button>
        </div>
    </div>

    <!-- AI 拍照上載區域 -->
    <div class="card">
        <div class="card-title">📸 AI 收據快速掃描</div>
        <div class="upload-box" onclick="document.getElementById('file-input').click()">
            <div class="icon">📷</div>
            <p>點擊拍照或上載收據 / 發票照片</p>
            <span>AI 自動提取金額、日期、商家與類別</span>
        </div>
        <input type="file" id="file-input" accept="image/*" capture="environment" style="display: none;" onchange="handleImageUpload(event)">
        <img id="image-preview" class="preview-img" alt="收據預覽">
    </div>

    <!-- 記帳表單 -->
    <div class="card">
        <div class="card-title">📝 記帳資料編輯</div>

        <!-- 交易類型選單 -->
        <div class="type-toggle">
            <div class="type-btn active-expense" id="btn-expense" onclick="setType('expense')">💸 支出</div>
            <div class="type-btn" id="btn-income" onclick="setType('income')">💰 收入</div>
        </div>

        <!-- 成員標籤 -->
        <div class="form-group">
            <label>👨‍👩‍👧 歸屬家庭成員</label>
            <div class="pill-group" id="member-pills">
                <div class="pill active" onclick="selectMember('爸爸', this)">👨 爸爸</div>
                <div class="pill" onclick="selectMember('媽媽', this)">👩 媽媽</div>
                <div class="pill" onclick="selectMember('大女兒', this)">👧 大女兒</div>
                <div class="pill" onclick="selectMember('小女兒', this)">👶 小女兒</div>
                <div class="pill" onclick="selectMember('全家', this)">🏠 全家共享</div>
            </div>
        </div>

        <!-- 類別標籤 -->
        <div class="form-group">
            <label>🏷️ 支出 / 收入類別</label>
            <div class="pill-group" id="category-pills">
                <div class="pill active" onclick="selectCategory('餐飲', this)">🍎 餐飲</div>
                <div class="pill" onclick="selectCategory('教育文具', this)">🎒 教育文具</div>
                <div class="pill" onclick="selectCategory('娛樂玩具', this)">🧸 娛樂玩具</div>
                <div class="pill" onclick="selectCategory('日常用品', this)">🛒 日常用品</div>
                <div class="pill" onclick="selectCategory('醫療健康', this)">🏥 醫療健康</div>
                <div class="pill" onclick="selectCategory('交通出行', this)">🚗 交通出行</div>
                <div class="pill" onclick="selectCategory('其他', this)">📦 其他</div>
            </div>
        </div>

        <!-- 詳細欄位 -->
        <div class="form-group">
            <label for="input-amount">金額 ($)</label>
            <input type="number" id="input-amount" placeholder="0" step="any" inputmode="decimal">
        </div>

        <div class="form-group">
            <label for="input-merchant">商家 / 項目說明</label>
            <input type="text" id="input-merchant" placeholder="例如：全聯福利中心 / 學校學費">
        </div>

        <div class="form-group">
            <label for="input-date">日期</label>
            <input type="date" id="input-date">
        </div>

        <button style="width: 100%; margin-top: 8px;" onclick="addRecord()">➕ 新增記錄</button>
    </div>

    <!-- 統計與明細區塊 -->
    <div class="card">
        <div class="card-title">
            <span>📊 本月統計摘要</span>
            <button class="btn-secondary" style="font-size: 0.75rem; padding: 4px 8px;" onclick="exportCSV()">📥 匯出 CSV</button>
        </div>
        <div class="summary-grid">
            <div class="summary-card">
                <h4>總支出</h4>
                <div id="total-expense" style="color: var(--expense);">$0</div>
            </div>
            <div class="summary-card">
                <h4>總收入</h4>
                <div id="total-income" style="color: var(--income);">$0</div>
            </div>
        </div>

        <!-- 成員消費統計 -->
        <div class="form-group">
            <label>👨‍👩‍👧‍👧 成員消費分布</label>
            <div id="member-breakdown" style="font-size: 0.85rem; color: var(--text-muted);">尚無數據</div>
        </div>
    </div>

    <!-- 歷史記錄列表 -->
    <div class="card">
        <div class="card-title">
            <span>📋 最近記帳明細</span>
            <button class="btn-danger" style="font-size: 0.75rem; padding: 4px 8px;" onclick="clearAllRecords()">清空紀錄</button>
        </div>
        <div id="records-list"></div>
    </div>

    <!-- Loading 動畫 Overlay -->
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <p id="loading-text">Gemini AI 辨識中，請稍候...</p>
    </div>

    <script>
        let currentType = 'expense';
        let currentMember = '爸爸';
        let currentCategory = '餐飲';
        let records = JSON.parse(localStorage.getItem('family_records') || '[]');

        window.onload = function() {
            document.getElementById('input-date').valueAsDate = new Date();
            const savedKey = localStorage.getItem('gemini_api_key');
            if(savedKey) {
                document.getElementById('api-key').value = savedKey;
                document.getElementById('api-status').innerText = '✅ 已設定';
                document.getElementById('api-status').style.color = '#10B981';
            }
            renderRecords();
        };

        function saveApiKey() {
            const key = document.getElementById('api-key').value.trim();
            if(key) {
                localStorage.setItem('gemini_api_key', key);
                document.getElementById('api-status').innerText = '✅ 已設定';
                document.getElementById('api-status').style.color = '#10B981';
                alert('Gemini API Key 已成功儲存！');
            } else {
                alert('請輸入有效的 API Key');
            }
        }

        function setType(type) {
            currentType = type;
            document.getElementById('btn-expense').className = type === 'expense' ? 'type-btn active-expense' : 'type-btn';
            document.getElementById('btn-income').className = type === 'income' ? 'type-btn active-income' : 'type-btn';
        }

        function selectMember(member, element) {
            currentMember = member;
            document.querySelectorAll('#member-pills .pill').forEach(p => p.classList.remove('active'));
            element.classList.add('active');
        }

        function selectCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('#category-pills .pill').forEach(p => p.classList.remove('active'));
            element.classList.add('active');
        }

        function setActivePill(containerId, value) {
            const pills = document.querySelectorAll(`#${containerId} .pill`);
            pills.forEach(pill => {
                if(pill.innerText.includes(value)) pill.click();
            });
        }

        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if(!file) return;

            const apiKey = localStorage.getItem('gemini_api_key');
            if(!apiKey) {
                alert('請先在上方填寫並儲存您的 Gemini API Key！');
                return;
            }

            const reader = new FileReader();
            reader.onload = e => {
                const img = document.getElementById('image-preview');
                img.src = e.target.result;
                img.style.display = 'block';
            };
            reader.readAsDataURL(file);

            showLoading('🤖 Gemini AI 正在辨識發票/收據內容...');

            try {
                const base64Data = await fileToBase64(file);
                const response = await fetch(`[https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$){apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                {
                                    text: `請分析這張發票或收據照片，提取以下資訊並以 JSON 格式回應 (只輸出 JSON，不要包含 markdown codeblock 或其他補充文字)：
                                    {
                                      "amount": 數字總金額,
                                      "date": "YYYY-MM-DD 格式日期",
                                      "merchant": "商家或項目名稱",
                                      "category": "餐飲" | "教育文具" | "娛樂玩具" | "日常用品" | "醫療健康" | "交通出行" | "其他",
                                      "member_suggestion": "爸爸" | "媽媽" | "大女兒" | "小女兒" | "全家"
                                    }`
                                },
                                { inline_data: { mime_type: file.type || "image/jpeg", data: base64Data } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                hideLoading();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let rawText = data.candidates[0].content.parts[0].text.trim().replace(/```json/g, '').replace(/```/g, '').trim();
                    const result = JSON.parse(rawText);

                    if(result.amount) document.getElementById('input-amount').value = result.amount;
                    if(result.merchant) document.getElementById('input-merchant').value = result.merchant;
                    if(result.date) document.getElementById('input-date').value = result.date;
                    if(result.category) setActivePill('category-pills', result.category);
                    if(result.member_suggestion) setActivePill('member-pills', result.member_suggestion);

                    alert('✨ AI 辨識成功！請核對資料後點擊「新增記錄」。');
                } else {
                    alert('⚠️ 辨識失敗或找不到發票內容，請手動輸入。');
                }
            } catch (err) {
                hideLoading();
                console.error(err);
                alert('❌ 辨識過程發生錯誤：' + err.message);
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        function addRecord() {
            const amount = parseFloat(document.getElementById('input-amount').value);
            const merchant = document.getElementById('input-merchant').value.trim() || '未填寫商家';
            const date = document.getElementById('input-date').value;

            if(!amount || isNaN(amount)) {
                alert('請輸入有效金額！');
                return;
            }

            records.unshift({
                id: Date.now(),
                type: currentType,
                member: currentMember,
                category: currentCategory,
                amount: amount,
                merchant: merchant,
                date: date
            });

            saveRecords();
            renderRecords();

            document.getElementById('input-amount').value = '';
            document.getElementById('input-merchant').value = '';
            document.getElementById('image-preview').style.display = 'none';
        }

        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            saveRecords();
            renderRecords();
        }

        function clearAllRecords() {
            if(confirm('確定要清空所有記帳記錄嗎？')) {
                records = [];
                saveRecords();
                renderRecords();
            }
        }

        function saveRecords() {
            localStorage.setItem('family_records', JSON.stringify(records));
        }

        function renderRecords() {
            const listEl = document.getElementById('records-list');
            listEl.innerHTML = '';

            let totalExp = 0, totalInc = 0;
            const memberExp = {};

            if(records.length === 0) {
                listEl.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">尚無記帳紀錄，趕快開始第一筆吧！</div>';
            }

            records.forEach(r => {
                if(r.type === 'expense') {
                    totalExp += r.amount;
                    memberExp[r.member] = (memberExp[r.member] || 0) + r.amount;
                } else {
                    totalInc += r.amount;
                }

                const item = document.createElement('div');
                item.className = 'record-item';
                item.innerHTML = `
                    <div class="record-info">
                        <div class="record-title">${escapeHtml(r.merchant)}</div>
                        <div class="record-tags">
                            <span class="tag">${r.date}</span>
                            <span class="tag">👤 ${r.member}</span>
                            <span class="tag">🏷️ ${r.category}</span>
                        </div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="record-amount ${r.type}">${r.type === 'expense' ? '-' : '+'}$${r.amount.toLocaleString()}</span>
                        <button class="delete-btn" onclick="deleteRecord(${r.id})">🗑️</button>
                    </div>
                `;
                listEl.appendChild(item);
            });

            document.getElementById('total-expense').innerText = `$${totalExp.toLocaleString()}`;
            document.getElementById('total-income').innerText = `$${totalInc.toLocaleString()}`;

            const breakdownEl = document.getElementById('member-breakdown');
            if(Object.keys(memberExp).length === 0) {
                breakdownEl.innerText = '尚無支出數據';
            } else {
                let html = '<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px;">';
                for(const [member, amt] of Object.entries(memberExp)) {
                    const percent = totalExp > 0 ? Math.round((amt / totalExp) * 100) : 0;
                    html += `<div style="background:#F3F4F6; padding: 4px 8px; border-radius: 6px;">${member}: <b>$${amt.toLocaleString()}</b> (${percent}%)</div>`;
                }
                html += '</div>';
                breakdownEl.innerHTML = html;
            }
        }

        function exportCSV() {
            if(records.length === 0) return alert('沒有紀錄可供匯出！');
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF日期,類型,歸屬成員,類別,商家/項目,金額\n";
            records.forEach(r => {
                csvContent += `"${r.date}","${r.type === 'expense' ? '支出' : '收入'}","${r.member}","${r.category}","${r.merchant.replace(/"/g, '""')}",${r.amount}\n`;
            });
            const link = document.createElement("a");
            link.href = encodeURI(csvContent);
            link.download = `家庭記帳備份_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        function showLoading(text) {
            document.getElementById('loading-text').innerText = text || '處理中...';
            document.getElementById('loading').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
