<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✍️ 快速 Logging - Daily Log</title>
  
  <!-- 載入全站設定與白名單 -->
  <script src="config.js"></script>
  <script src="allowed-emails.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  
  <!-- Google 官方 Identity SDK 驗證 -->
  <script src="https://accounts.google.com/gsi/client" onload="initGoogleSignIn()" async defer></script>
  
  <style>
    :root {
      --primary-color: #0284c7;
      --bg-color: #f8fafc;
      --border-color: #cbd5e1;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: #1e293b;
      margin: 0;
      padding: 12px;
    }

    /* Google 登入驗證遮罩 */
    .auth-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 16px;
    }
    .auth-card {
      background: #ffffff;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      padding: 28px 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    .auth-title { font-size: 1.25rem; font-weight: bold; color: #0f172a; margin-bottom: 8px; }
    .auth-desc { font-size: 0.85rem; color: #64748b; margin-bottom: 20px; }
    .google-btn-wrapper { display: flex; justify-content: center; min-height: 40px; }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: none;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .nav-btn {
      padding: 8px 14px;
      font-size: 0.88rem;
      border-radius: 6px;
      text-decoration: none;
      background: #e2e8f0;
      color: #475569;
      font-weight: bold;
    }
    .nav-btn.active { background: var(--primary-color); color: #ffffff; }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .page-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--primary-color);
    }
    .user-profile {
      font-size: 0.8rem;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logout-btn {
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    #statusMessage {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 12px;
      min-height: 20px;
    }

    .logging-card {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .form-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .form-group {
      flex: 1;
      min-width: 140px;
    }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: bold;
      color: #334155;
      margin-bottom: 4px;
    }
    .form-group select, .form-group input, .form-group textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.9rem;
      background: #fff;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 0.88rem;
      color: #475569;
    }

    .submit-btn {
      background: var(--primary-color);
      color: #fff;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(2,132,199,0.2);
    }
    .submit-btn:hover { background: #02689d; }

    .recent-section {
      margin-top: 20px;
    }
    .recent-title {
      font-size: 1rem;
      font-weight: bold;
      color: #0f172a;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }
    .log-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 350px;
      overflow-y: auto;
    }
    .log-item {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }
    .log-content { display: flex; flex-direction: column; gap: 3px; }
    .log-text { font-weight: bold; color: #0f172a; } /* 粗體樣式類別 */
    .log-meta { font-size: 0.75rem; color: #64748b; display: flex; gap: 8px; }
    .badge {
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge.Task { background: #e0e7ff; color: #3730a3; }
    .badge.Event { background: #fef3c7; color: #92400e; }
    .badge.Note { background: #f1f5f9; color: #475569; }
    .badge.done { background: #dcfce7; color: #15803d; }
    .badge.pending { background: #fef2f2; color: #b91c1c; }
  </style>
</head>
<body>

  <!-- Google 登入驗證遮罩 -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
      <div class="auth-title">✍️ 快速 Logging</div>
      <div class="auth-desc">請登入 Google 帳號以驗證身分</div>
      <div class="google-btn-wrapper">
        <div id="googleSignInContainer"></div>
      </div>
      <div id="loginErr" style="color: #ff3b30; font-size: 0.8rem; margin-top: 8px; white-space: pre-line;"></div>
    </div>
  </div>

  <div class="container" id="mainContainer">
    <div id="navbar" class="nav-tabs"></div>

    <div class="header-bar">
      <div class="page-title">✍️ 快速 Logging 記錄器</div>
      <div class="user-profile">
        <span id="userInfo"></span>
        <button class="logout-btn" onclick="logout()">登出</button>
      </div>
    </div>

    <div id="statusMessage"></div>

    <!-- 快速 Logging 表單 -->
    <form class="logging-card" onsubmit="handleQuickLogSubmit(event)">
      <div class="form-row">
        <div class="form-group">
          <label>📌 種類 (Type)</label>
          <select id="logType">
            <option value="Task">Task (任務)</option>
            <option value="Event">Event (事件)</option>
            <option value="Note">Note (筆記)</option>
          </select>
        </div>

        <div class="form-group">
          <label>📊 狀態 (Status)</label>
          <select id="logStatus">
            <option value="Pending">⏳ 待辦 (Pending)</option>
            <option value="完成">✓ 已完成 (完成)</option>
          </select>
        </div>

        <div class="form-group">
          <label>😀 常用 Emoji</label>
          <select id="logEmoji">
            <option value="">無</option>
            <option value="📌">📌 釘選</option>
            <option value="🔥">🔥 重要</option>
            <option value="⚠️">⚠️ 緊急</option>
            <option value="💡">💡 想法</option>
            <option value="🏫">🏫 學校</option>
            <option value="📞">📞 電話</option>
            <option value="🛒">🛒 購物</option>
          </select>
        </div>

        <div class="form-group" id="dateGroup">
          <label>📅 記錄日期</label>
          <input type="date" id="logDate">
        </div>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="isBacklog" onchange="toggleDateInput(this)">
        <label for="isBacklog">無日期 (存入 Backlog 備忘庫)</label>
      </div>

      <div class="form-group" style="margin-bottom: 12px;">
        <label>📝 內容 (支援 #hashtag 自動標籤)：</label>
        <textarea id="logContent" rows="3" placeholder="輸入事項、靈感或工作進度... 例：準備明天會議資料 #work #meeting" required></textarea>
      </div>

      <button type="submit" class="submit-btn">⚡ 立即送出 Logging</button>
    </form>

    <!-- 最近新增紀錄預覽 -->
    <div class="recent-section">
      <div class="recent-title">📋 最近已送出項目預覽</div>
      <div id="recentList" class="log-list">
        <div style="color: #64748b; font-size: 0.85rem;">尚無近期送出紀錄</div>
      </div>
    </div>
  </div>

  <script>
    function getTodayString() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadNavbar();
      document.getElementById('logDate').value = getTodayString();
      
      const savedEmail = sessionStorage.getItem("user_google_email");
      if (savedEmail && typeof ALLOWED_EMAILS !== 'undefined' && Array.isArray(ALLOWED_EMAILS)) {
        const cleanList = ALLOWED_EMAILS.map(e => e.toLowerCase().trim());
        if (cleanList.includes(savedEmail.toLowerCase().trim())) {
          initializeApp();
          return;
        }
      }
      checkLoginStatus();
    });

    function initGoogleSignIn() {
      if (typeof CONFIG !== 'undefined' && CONFIG.GOOGLE_CLIENT_ID) {
        google.accounts.id.initialize({
          client_id: CONFIG.GOOGLE_CLIENT_ID,
          callback: handleCredentialResponse
        });
        google.accounts.id.renderButton(
          document.getElementById("googleSignInContainer"),
          { theme: "outline", size: "large", type: "standard", shape: "rectangular" }
        );
      }
    }

    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(decodeURIComponent(window.atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
      } catch(e) { return null; }
    }

    function handleCredentialResponse(response) {
      const payload = parseJwt(response.credential);
      if (payload && payload.email) {
        const userEmail = payload.email.toLowerCase().trim();
        if (typeof ALLOWED_EMAILS !== 'undefined' && Array.isArray(ALLOWED_EMAILS)) {
          const cleanList = ALLOWED_EMAILS.map(e => e.toLowerCase().trim());
          if (!cleanList.includes(userEmail)) {
            document.getElementById('loginErr').innerText = `⚠️ 存取被拒：\n${userEmail}\n未獲授權使用此系統。`;
            return;
          }
        }
        sessionStorage.setItem("user_google_email", userEmail);
        sessionStorage.setItem('google_user', JSON.stringify({ name: payload.name, email: userEmail, picture: payload.picture }));
        initializeApp();
      }
    }

    function checkLoginStatus() {
      if (sessionStorage.getItem('user_google_email')) {
        initializeApp();
      } else {
        document.getElementById('authOverlay').style.display = 'flex';
        document.getElementById('mainContainer').style.display = 'none';
      }
    }

    function logout() {
      sessionStorage.clear();
      location.reload();
    }

    function initializeApp() {
      document.getElementById('authOverlay').style.display = 'none';
      document.getElementById('mainContainer').style.display = 'block';
      const user = JSON.parse(sessionStorage.getItem('google_user') || '{}');
      if (user.email) document.getElementById('userInfo').textContent = user.email;
      loadRecentLocalLogs();
    }

    function loadNavbar() {
      fetch('nav.html')
        .then(res => res.text())
        .then(data => {
          const navContainer = document.getElementById('navbar');
          if (navContainer) {
            navContainer.innerHTML = data;
            const currentPath = window.location.pathname.split('/').pop() || 'logging.html';
            navContainer.querySelectorAll('.nav-btn').forEach(link => {
              if (link.getAttribute('href') === currentPath) link.classList.add('active');
            });
          }
        }).catch(err => console.log('導覽列載入失敗', err));
    }

    function toggleDateInput(checkbox) {
      const dateInput = document.getElementById('logDate');
      dateInput.disabled = checkbox.checked;
      dateInput.style.opacity = checkbox.checked ? '0.4' : '1';
    }

    function showStatus(text, color = '#0284c7') {
      const msg = document.getElementById('statusMessage');
      if (msg) {
        msg.style.color = color;
        msg.textContent = text;
      }
    }

    function handleQuickLogSubmit(e) {
      e.preventDefault();
      const type = document.getElementById('logType').value;
      const status = document.getElementById('logStatus').value;
      const emoji = document.getElementById('logEmoji').value;
      const isBacklog = document.getElementById('isBacklog').checked;
      const rawDate = document.getElementById('logDate').value;
      const rawContent = document.getElementById('logContent').value.trim();

      if (!rawContent) return;

      const finalContent = emoji ? `${emoji} ${rawContent}` : rawContent;
      const targetDate = isBacklog ? "" : rawDate;
      const newId = 'L' + new Date().getTime();

      showStatus('⏳ 正在同步寫入 Google Sheet...');

      const apiUrl = (typeof CONFIG !== 'undefined' && CONFIG.API_URLS) ? CONFIG.API_URLS.DAILY : '';
      if (!apiUrl) {
        showStatus('❌ 錯誤：config.js 中未設定 API_URLS.DAILY', '#ef4444');
        return;
      }

      const params = new URLSearchParams({
        action: 'addLog',
        key: CONFIG.SECRET_KEY || '',
        id: newId,
        date: targetDate,
        type: type,
        content: finalContent,
        status: status,
        remarks: ''
      });

      fetch(`${apiUrl}?${params.toString()}`, { mode: 'no-cors' })
        .then(() => {
          showStatus('✅ 成功送出 Logging！', '#16a34a');
          document.getElementById('logContent').value = '';
          saveToRecentLocal({ id: newId, type, status, date: targetDate || '無日期 (Backlog)', content: finalContent });
          loadRecentLocalLogs();
          setTimeout(() => showStatus(''), 3000);
        })
        .catch(err => {
          console.error(err);
          showStatus('❌ 寫入失敗，請檢查 API 設定', '#ef4444');
        });
    }

    function saveToRecentLocal(item) {
      let recent = JSON.parse(localStorage.getItem('recent_logging') || '[]');
      recent.unshift(item);
      if (recent.length > 10) recent = recent.slice(0, 10);
      localStorage.setItem('recent_logging', JSON.stringify(recent));
    }

    function loadRecentLocalLogs() {
      const recent = JSON.parse(localStorage.getItem('recent_logging') || '[]');
      const container = document.getElementById('recentList');
      if (!container) return;

      if (recent.length === 0) {
        container.innerHTML = '<div style="color: #64748b; font-size: 0.85rem;">尚無近期送出紀錄</div>';
        return;
      }

      container.innerHTML = '';
      recent.forEach(item => {
        const isDone = (item.status === '完成' || item.status === 'Done');
        const div = document.createElement('div');
        div.className = 'log-item';
        div.innerHTML = `
          <div class="log-content">
            <div><span class="badge ${item.type}">${item.type}</span> <span class="log-text">${item.content}</span></div>
            <div class="log-meta">
              <span>📅 ${item.date}</span>
              <span class="badge ${isDone ? 'done' : 'pending'}">${item.status}</span>
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
