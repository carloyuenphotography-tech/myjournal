<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>足跡計時器 - Time & Location Tracker</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md shadow-indigo-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg text-slate-900 leading-tight">足跡計時器</h1>
                    <p class="text-[11px] text-slate-500">記錄活動時間與定位足跡</p>
                </div>
            </div>
            <div class="flex items-center space-x-1 sm:space-x-2 bg-slate-100 p-1 rounded-xl">
                <button onclick="switchTab('timer')" id="btn-tab-timer" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-white text-indigo-700 shadow-xs transition">計時器</button>
                <button onclick="switchTab('history')" id="btn-tab-history" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg text-slate-600 hover:text-slate-900 transition">記錄與雲端</button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-3 sm:px-4 py-4 sm:py-6 space-y-4 sm:space-y-6">

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 text-xs sm:text-sm">
            <span>✨</span>
            <span id="toast-msg">提示訊息</span>
        </div>

        <!-- ==================== TIMER VIEW ==================== -->
        <div id="view-timer" class="space-y-4 sm:space-y-6">
            <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-xs space-y-4">
                <div>
                    <label class="block text-xs sm:text-sm font-semibold text-slate-700 mb-2">選擇或輸入活動類別：</label>
                    <div id="category-chips" class="flex flex-wrap gap-1.5 sm:gap-2"></div>
                </div>
                
                <div class="space-y-3">
                    <div>
                        <input type="text" id="activity-name" placeholder="例如：專注工作、靜觀放鬆、搭乘地鐵..." class="w-full px-3.5 py-2.5 sm:py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-sm sm:text-base text-slate-800 placeholder-slate-400">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 sm:gap-3">
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            </span>
                            <input type="text" id="location-input" placeholder="起點/地點（可自動抓取或自訂）" class="w-full pl-9 pr-24 py-2 sm:py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-xs sm:text-sm text-slate-700 placeholder-slate-400">
                            <button type="button" onclick="fetchGPSLocation()" class="absolute right-1 top-1 bottom-1 px-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition flex items-center space-x-1">
                                <svg class="w-3 h-3 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.115 6.848l.015-.045M12 3a9 9 0 100 18 9 9 0 000-18z"></path></svg>
                                <span>自動GPS</span>
                            </button>
                        </div>
                        <div>
                            <input type="text" id="activity-notes" placeholder="備忘或詳細事項（選填）" class="w-full px-3.5 py-2 sm:py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-xs sm:text-sm text-slate-700 placeholder-slate-400">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Timer Display Card -->
            <div id="timer-card" class="bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-xs text-center flex flex-col items-center justify-center relative overflow-hidden">
                <div id="active-indicator" class="absolute top-4 right-4 flex items-center space-x-2 hidden">
                    <span class="relative flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                    <span class="text-xs font-medium text-emerald-600">計時中</span>
                </div>

                <div class="text-[11px] sm:text-xs uppercase tracking-wider font-semibold text-slate-400 mb-2" id="current-active-label">準備開始</div>
                <div id="timer-display" class="font-mono text-5xl sm:text-7xl font-extrabold text-slate-800 tracking-tight mb-6 sm:mb-8">00:00:00</div>

                <div class="flex items-center justify-center space-x-3 w-full max-w-xs">
                    <button id="btn-start" onclick="startTimer()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-5 rounded-xl shadow-md shadow-indigo-200 transition transform active:scale-95 flex items-center justify-center space-x-2 text-sm sm:text-base">
                        <span>開始計時</span>
                    </button>
                    <button id="btn-stop" onclick="stopTimer()" disabled class="flex-1 bg-slate-200 text-slate-400 cursor-not-allowed font-semibold py-3 px-5 rounded-xl transition flex items-center justify-center space-x-2 text-sm sm:text-base">
                        <span>完成記錄</span>
                    </button>
                </div>
            </div>

            <div id="live-meta-panel" class="bg-indigo-50 border border-indigo-100 p-3.5 sm:p-4 rounded-xl flex items-center justify-between text-xs sm:text-sm hidden">
                <div class="flex items-center space-x-2 sm:space-x-3 truncate">
                    <div class="text-indigo-600 font-semibold truncate" id="live-activity-name">活動名稱</div>
                    <span class="text-indigo-300">|</span>
                    <div class="text-slate-600 truncate" id="live-location-text">地點未設定</div>
                </div>
                <div class="text-indigo-700 font-mono text-[11px] sm:text-xs shrink-0" id="live-start-time">開始於 --:--</div>
            </div>
        </div>

        <!-- ==================== HISTORY & GOOGLE SHEET VIEW ==================== -->
        <div id="view-history" class="space-y-4 sm:space-y-6 hidden">
            
            <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-xs space-y-3">
                <div class="flex items-center justify-between">
                    <h2 class="font-bold text-sm sm:text-base text-slate-800">📊 Google Sheet 雲端設定</h2>
                    <button onclick="saveSheetConfig()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg transition shadow-xs">儲存設定</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-1">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Apps Script 寫入網址</label>
                        <input type="text" id="cfg-webhook" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">試算表 ID (Spreadsheet ID)</label>
                        <input type="text" id="cfg-sheet-id" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">工作表 GID</label>
                        <input type="text" id="cfg-gid" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs outline-none focus:border-indigo-500">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2.5 sm:gap-4">
                <div class="bg-white p-3.5 sm:p-5 rounded-2xl border border-slate-200 shadow-xs">
                    <p class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">本機總次數</p>
                    <h3 class="text-lg sm:text-2xl font-bold text-slate-800" id="stat-total-count">0</h3>
                </div>
                <div class="bg-white p-3.5 sm:p-5 rounded-2xl border border-slate-200 shadow-xs">
                    <p class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">總花費時間</p>
                    <h3 class="text-lg sm:text-2xl font-bold text-indigo-600" id="stat-total-time">0 分鐘</h3>
                </div>
                <div class="bg-white p-3.5 sm:p-5 rounded-2xl border border-slate-200 shadow-xs">
                    <p class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">最頻繁活動</p>
                    <h3 class="text-lg sm:text-2xl font-bold text-slate-800 truncate" id="stat-top-activity">無</h3>
                </div>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-2.5 bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200 shadow-xs">
                <select id="filter-category" onchange="renderHistory()" class="px-3 py-1.5 sm:py-2 rounded-xl border border-slate-200 text-xs sm:text-sm bg-slate-50 outline-none focus:border-indigo-500">
                    <option value="">所有活動類別</option>
                </select>
                <div class="flex items-center space-x-2">
                    <button onclick="loadGoogleSheetData()" class="px-3 py-1.5 text-xs font-medium bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl transition">讀取雲端</button>
                    <button onclick="clearAllHistory()" class="px-3 py-1.5 text-xs font-medium bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl transition">清除本機</button>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                <div class="p-3.5 sm:p-4 border-b border-slate-100 font-semibold text-xs sm:text-sm text-slate-700 flex justify-between items-center">
                    <span id="history-list-title">本機歷史足跡記錄 (點擊可檢視/修改)</span>
                    <span class="text-xs font-normal text-slate-400" id="history-count-badge">共 0 筆</span>
                </div>
                <div id="history-list" class="divide-y divide-slate-100 max-h-[450px] overflow-y-auto text-xs sm:text-sm"></div>
            </div>
        </div>

    </main>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-xl space-y-4">
            <h3 class="font-bold text-base text-slate-800">修改記錄內容</h3>
            <input type="hidden" id="edit-id">
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">活動名稱</label>
                    <input type="text" id="edit-activity" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">地點</label>
                    <input type="text" id="edit-location" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">備忘</label>
                    <textarea id="edit-notes" rows="3" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm outline-none focus:border-indigo-500"></textarea>
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeEditModal()" class="px-4 py-2 bg-slate-100 text-slate-600 text-xs font-semibold rounded-xl transition">取消</button>
                <button onclick="saveEditedRecord()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl transition shadow-sm">儲存修改</button>
            </div>
        </div>
    </div>

    <footer class="text-center py-6 text-[11px] text-slate-400">
        足跡計時器 &copy; 2026 - PWA流動辦公與生活追蹤
    </footer>

    <script src="tracker.js"></script>
</body>
</html>
