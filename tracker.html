<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>足跡計時器 - Time & Location Tracker</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        html { -webkit-text-size-adjust: 100%; }
        body { font-family: 'Noto Sans TC', 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        
        .btn-hamburger {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #4f46e5;
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 1.2rem;
            line-height: 1;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .btn-hamburger:hover { background: #4f46e5; color: #fff; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased text-xs sm:text-sm">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-sm">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-sm sm:text-base text-slate-900 leading-tight">足跡計時器</h1>
                    <p class="text-[10px] sm:text-xs text-slate-400">記錄時間與定位足跡</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl">
                    <button onclick="switchTab('timer')" id="btn-tab-timer" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-white text-indigo-700 shadow-xs transition">計時器</button>
                    <button onclick="switchTab('history')" id="btn-tab-history" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg text-slate-600 hover:text-slate-900 transition">記錄</button>
                </div>
                <button type="button" class="btn-hamburger" onclick="toggleNavMenu()" title="切換選單">☰</button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-3 sm:px-4 py-4 sm:py-6 space-y-4">
        <div id="navbar" class="nav-tabs"></div>

        <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-xs sm:text-sm">
            <span>✨</span>
            <span id="toast-msg">提示訊息</span>
        </div>

        <div id="view-timer" class="space-y-4">
            <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-xs space-y-3">
                <div>
                    <label class="block text-xs sm:text-sm font-semibold text-slate-600 mb-2">選擇或輸入活動類別：</label>
                    <div id="category-chips" class="flex flex-wrap gap-1.5"></div>
                </div>
                
                <div class="space-y-3">
                    <div>
                        <input type="text" id="activity-name" placeholder="例如：專注工作、戶外散步..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none transition text-xs sm:text-sm text-slate-800 placeholder-slate-400">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            </span>
                            <input type="text" id="location-input" placeholder="起點/地點（自動抓取或自訂）" class="w-full pl-9 pr-24 py-2 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none transition text-xs sm:text-sm text-slate-700 placeholder-slate-400">
                            <button type="button" onclick="fetchGPSLocation()" class="absolute right-1.5 top-1.5 bottom-1.5 px-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition flex items-center space-x-1">
                                <svg class="w-3.5 h-3.5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.115 6.848l.015-.045M12 3a9 9 0 100 18 9 9 0 000-18z"></path></svg>
                                <span>自動GPS</span>
                            </button>
                        </div>
                        <div>
                            <input type="text" id="activity-notes" placeholder="備忘或詳細事項（選填）" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none transition text-xs sm:text-sm text-slate-700 placeholder-slate-400">
                        </div>
                    </div>
                </div>
            </div>

            <div id="timer-card" class="bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-xs text-center flex flex-col items-center justify-center relative overflow-hidden">
                <div id="active-indicator" class="absolute top-4 right-4 flex items-center space-x-1.5 hidden">
                    <span class="relative flex h-2.5 w-2.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                    <span class="text-xs font-medium text-emerald-600">計時中</span>
                </div>

                <div class="text-xs uppercase tracking-wider font-semibold text-slate-400 mb-1" id="current-active-label">準備開始</div>
                <div id="timer-display" class="font-mono text-5xl sm:text-7xl font-extrabold text-slate-800 tracking-tight mb-4">00:00:00</div>

                <div id="waypoint-container" class="mb-5 w-full max-w-xs hidden">
                    <button type="button" onclick="addWayPoint()" class="w-full py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium rounded-xl text-xs transition border border-indigo-200 flex items-center justify-center space-x-1.5">
                        <span>📍</span>
                        <span>記錄當前中途點</span>
                    </button>
                    <div id="waypoint-list-preview" class="text-[11px] text-slate-500 mt-1.5 truncate">已記錄中途點：起點</div>
                </div>

                <div class="flex items-center justify-center space-x-3 w-full max-w-xs">
                    <button id="btn-start" onclick="startTimer()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-xs transition transform active:scale-95 text-xs sm:text-sm">
                        <span>開始計時</span>
                    </button>
                    <button id="btn-stop" onclick="confirmStopTimer()" disabled class="flex-1 bg-slate-200 text-slate-400 cursor-not-allowed font-semibold py-3 px-4 rounded-xl transition text-xs sm:text-sm">
                        <span>完成記錄</span>
                    </button>
                </div>
            </div>

            <div id="live-meta-panel" class="bg-indigo-50 border border-indigo-100 p-3.5 rounded-xl flex items-center justify-between text-xs sm:text-sm hidden">
                <div class="flex items-center space-x-2 truncate">
                    <div class="text-indigo-600 font-semibold truncate" id="live-activity-name">活動</div>
                    <span class="text-indigo-300">|</span>
                    <div class="text-slate-600 truncate" id="live-location-text">地點</div>
                </div>
                <div class="text-indigo-700 font-mono text-xs shrink-0" id="live-start-time">--:--</div>
            </div>
        </div>

        <div id="view-history" class="space-y-4 hidden">
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs text-center">
                    <p class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">總次數</p>
                    <h3 class="text-lg sm:text-2xl font-bold text-slate-800" id="stat-total-count">0</h3>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs text-center">
                    <p class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">總時間</p>
                    <h3 class="text-lg sm:text-2xl font-bold text-indigo-600" id="stat-total-time">0 分</h3>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs text-center">
                    <p class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">最頻繁</p>
                    <h3 class="text-lg sm:text-2xl font-bold text-slate-800 truncate" id="stat-top-activity">無</h3>
                </div>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-2.5 bg-white p-3.5 rounded-2xl border border-slate-200 shadow-xs">
                <select id="filter-category" onchange="renderHistory()" class="px-3 py-2 rounded-xl border border-slate-200 text-xs sm:text-sm bg-slate-50 outline-none focus:border-indigo-500">
                    <option value="">所有類別</option>
                </select>
                <div class="flex items-center space-x-2">
                    <button onclick="loadGoogleSheetData()" class="px-3 py-2 text-xs font-medium bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl transition">讀取雲端</button>
                    <button onclick="clearAllHistory()" class="px-3 py-2 text-xs font-medium bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl transition">清除本機</button>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                <div class="p-4 border-b border-slate-100 font-semibold text-xs sm:text-sm text-slate-700 flex justify-between items-center">
                    <span id="history-list-title">本機歷史足跡 (點擊閱讀與修改)</span>
                    <span class="text-xs font-normal text-slate-400" id="history-count-badge">共 0 筆</span>
                </div>
                <div id="history-list" class="divide-y divide-slate-100 max-h-[450px] overflow-y-auto"></div>
            </div>
        </div>

    </main>

    <div id="edit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-xl space-y-4">
            <h3 class="font-bold text-base text-slate-800">記錄詳情與修改</h3>
            <input type="hidden" id="edit-id">
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">活動名稱</label>
                    <input type="text" id="edit-activity" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs sm:text-sm outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">經過地點/足跡</label>
                    <input type="text" id="edit-location" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs sm:text-sm outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">備忘</label>
                    <textarea id="edit-notes" rows="3" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs sm:text-sm outline-none focus:border-indigo-500"></textarea>
                </div>
                <div class="text-[11px] text-slate-400 space-y-0.5 pt-1">
                    <p id="edit-time-info">開始時間：--</p>
                    <p id="edit-duration-info">持續時間：--</p>
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeEditModal()" class="px-4 py-2 bg-slate-100 text-slate-600 text-xs sm:text-sm rounded-xl transition">關閉</button>
                <button onclick="saveEditedRecord()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm rounded-xl transition shadow-xs">儲存變更</button>
            </div>
        </div>
    </div>

    <div id="confirm-stop-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-xl space-y-4 text-center">
            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-xl">⏱️</div>
            <h3 class="font-bold text-base text-slate-800">確認完成記錄？</h3>
            <p class="text-xs sm:text-sm text-slate-500" id="confirm-stop-desc">準備儲存並將資料更新至雲端 Google Sheet。</p>
            <div class="flex space-x-2 pt-2">
                <button onclick="closeConfirmStopModal()" class="flex-1 py-2.5 bg-slate-100 text-slate-600 text-xs sm:text-sm rounded-xl transition">繼續計時</button>
                <button onclick="stopTimer()" class="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white text-xs sm:text-sm rounded-xl transition shadow-xs">確認完成</button>
            </div>
        </div>
    </div>

    <footer class="text-center py-5 text-[10px] sm:text-xs text-slate-400">
        足跡計時器 &copy; 2026
    </footer>

    <script src="tracker.js"></script>

<script>
function toggleNavMenu() {
  const nav = document.getElementById('navbar');
  if (nav) {
    nav.style.display = (nav.style.display === 'none' || getComputedStyle(nav).display === 'none') ? 'flex' : 'none';
  }
}

function loadGlobalNavbar() {
  fetch('nav.html')
    .then(res => res.text())
    .then(data => {
      const navContainer = document.getElementById('navbar');
      if (navContainer) {
        navContainer.innerHTML = data;
        const currentPath = window.location.pathname.split('/').pop() || 'tracker_2.html';
        navContainer.querySelectorAll('.nav-btn').forEach(link => {
          if (link.getAttribute('href') === currentPath) {
            link.classList.add('active');
          } else {
            link.classList.remove('active');
          }
        });
      }
    }).catch(err => console.error('導覽列載入失敗:', err));
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', loadGlobalNavbar);
} else {
  loadGlobalNavbar();
}
</script>

</body>
</html>
