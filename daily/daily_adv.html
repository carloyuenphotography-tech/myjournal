<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚡ 寸陰流光 - Daily Adv</title>
  
  <!-- 設定檔與外部套件 -->
  <script src="config.js"></script>
  <script src="allowed-emails.js"></script>
  <script src="daily_adv.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  
  <style>
    :root {
      --primary: #0284c7;
      --bg-color: #f8fafc;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: #0f172a;
      margin: 0;
      padding: 10px;
    }

    /* 驗證遮罩 */
    .auth-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999; padding: 16px;
    }
    .auth-card {
      background: #fff; border-radius: 16px; width: 100%; max-width: 360px;
      padding: 28px 20px; text-align: center;
    }

    .container {
      max-width: 850px; margin: 0 auto; background: #fff;
      padding: 12px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      display: none;
    }

    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color);
    }
    .title-group { font-size: 1.1rem; font-weight: bold; color: var(--primary); }

    /* 頂部 Bubble 氣泡按鈕區 */
    .top-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    
    .btn-bubble {
      border-radius: 20px; padding: 6px 12px; font-size: 0.8rem; font-weight: bold;
      cursor: pointer; display: inline-flex; align-items: center; gap: 4px; border: 1px solid transparent;
      transition: all 0.2s;
    }
    .btn-bubble:hover { opacity: 0.85; transform: translateY(-1px); }

    .btn-backlog { background: #f3e8ff; color: #7e22ce; border-color: #d8b4fe; }
    .btn-overdue { background: #fef2f2; color: #991b1b; border-color: #fca5a5; }
    .btn-completed { background: #f0fdf4; color: #166534; border-color: #86efac; }
    
    /* 回今天按鈕（向上箭嘴） */
    .today-btn {
      background: var(--primary); color: #fff; border: none; width: 32px; height: 32px;
      border-radius: 50%; font-weight: bold; cursor: pointer; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
    }

    .badge-pill {
      background: rgba(0,0,0,0.15); color: inherit; padding: 1px 7px;
      border-radius: 10px; font-size: 0.72rem;
    }

    /* ⚡ Rapid Logging 快速輸入區塊 (兩行式結構) */
    .quick-input-card {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .quick-input-row { display: flex; gap: 6px; align-items: center; }
    .quick-input-row select {
      padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border-color);
      font-size: 0.95rem; font-weight: bold; background: #fff; width: 44px; text-align: center;
    }
    .quick-input-row input[type="text"] {
      flex: 1; min-width: 0; padding: 6px 10px; border-radius: 6px;
      border: 1px solid var(--border-color); font-size: 0.85rem;
    }
    .btn-add-quick {
      background: var(--primary); color: #fff; border: none; padding: 5px 14px;
      border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.82rem; white-space: nowrap;
    }

    /* 時間軸 (Timeline Layout) */
    .timeline-container { display: flex; flex-direction: column; gap: 16px; margin-top: 14px; }

    .day-block { display: flex; gap: 12px; position: relative; }
    .day-date-col { width: 50px; flex-shrink: 0; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .day-weekday { font-size: 0.7rem; font-weight: bold; color: #64748b; text-transform: uppercase; }
    .day-number {
      font-size: 1.2rem; font-weight: bold; width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center; border-radius: 50%;
      margin-top: 2px; color: #334155;
    }
    
    .day-block.is-today .day-number { background: var(--primary); color: #fff; }
    .day-block.is-today .day-weekday { color: var(--primary); font-weight: bold; }

    .day-block.is-tomorrow .day-number { background: #0284c7; color: #fff; opacity: 0.85; }
    .day-block.is-tomorrow .day-weekday { color: #0284c7; font-weight: bold; }

    .day-content-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }

    .pending-tasks-pill {
      background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 12px;
      padding: 3px 10px; font-size: 0.75rem; color: #475569; font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px; width: fit-content;
    }

    /* 預設事項卡片樣式 */
    .task-card {
      background: #38bdf8; color: #fff; border-radius: 8px; padding: 10px 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer; transition: all 0.15s ease;
    }
    .task-card:active { transform: scale(0.99); opacity: 0.9; }
    .task-card.type-Event { background: #0284c7; }
    .task-card.type-Task { background: #2563eb; }
    .task-card.type-Note { background: #64748b; }

    /* 🎨 Hashtag 標籤顏色 */
    .task-card.tag-sch     { background-color: #fef08a !important; color: #713f12 !important; }
    .task-card.tag-family  { background-color: #dcfce7 !important; color: #14532d !important; }
    .task-card.tag-work    { background-color: #e0f2fe !important; color: #075985 !important; }
    .task-card.tag-urgent  { background-color: #ffe4e6 !important; color: #9f1239 !important; }
    .task-card.tag-finance { background-color: #ffedd5 !important; color: #9a3412 !important; }
    .task-card.tag-health  { background-color: #ccfbf1 !important; color: #115e59 !important; }
    .task-card.tag-personal{ background-color: #f3e8ff !important; color: #581c87 !important; }

    .task-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .task-title { font-weight: bold; font-size: 0.88rem; line-height: 1.35; word-break: break-word; }
    .task-remarks { font-size: 0.75rem; opacity: 0.9; margin-top: 2px; }

    /* Modal 對話框樣式修復 (加強頂部 Padding 解決遮擋) */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45); display: none; justify-content: center; align-items: center;
      z-index: 1000; padding: 16px;
    }
    .modal-card {
      background: #fff; border-radius: 16px; width: 100%; max-width: 460px;
      padding: 26px 18px 18px 18px; max-height: 80vh; display: flex; flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-header {
      font-size: 1rem; font-weight: bold; margin-bottom: 12px;
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color);
    }
    .modal-body { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
    .modal-actions-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 14px; flex-wrap: wrap; gap: 6px;
    }

    .fab-btn {
      position: fixed; bottom: 20px; right: 20px; width: 52px; height: 52px;
      border-radius: 50%; background: var(--primary); color: #fff; font-size: 1.5rem;
      border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer;
      display: flex; align-items: center; justify-content: center; z-index: 900;
    }

    /* 📱 手機屏極簡隱藏文字 */
    @media (max-width: 520px) {
      .btn-bubble .btn-text { display: none; }
      .btn-bubble { padding: 5px 9px; font-size: 0.85rem; }
    }

    /* 📱 WebApp Standalone 縮小設定 */
    @media all and (display-mode: standalone) {
      body { padding: 4px; }
      .container { padding: 8px; border-radius: 8px; }
      .header-bar { padding-bottom: 8px; gap: 6px; }
      .title-group { font-size: 0.95rem; }
      .btn-bubble { padding: 4px 8px; font-size: 0.8rem; }
      .today-btn { width: 28px; height: 28px; font-size: 0.8rem; }
      .quick-input-card { padding: 6px; gap: 6px; }
      .quick-input-row input[type="text"] { padding: 4px 8px; font-size: 0.8rem; }
      .btn-add-quick { padding: 4px 10px; font-size: 0.8rem; }
      .day-date-col { width: 42px; }
      .day-number { width: 28px; height: 28px; font-size: 1rem; }
      .day-weekday { font-size: 0.65rem; }
      .task-card { padding: 8px 10px; border-radius: 6px; }
      .task-title { font-size: 0.82rem; }
      .task-remarks { font-size: 0.7rem; }
      .timeline-container { gap: 10px; margin-top: 10px; }
    }
  </style>
</head>
<body>

  <!-- Google 登入驗證 -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
      <h3 style="margin-top:0;">⚡ 日軌浮光</h3>
      <p style="color:#64748b; font-size:0.85rem;">請先驗證 Google 帳號</p>
      <div id="googleSignInContainer" style="display:flex; justify-content:center; min-height:40px;"></div>
    </div>
  </div>

  <div class="container" id="mainContainer">
    <div class="header-bar">
      <!-- 詩意標題 -->
      <div class="title-group">✨ 寸陰流光</div>
      <div class="top-actions">
        <button class="btn-bubble btn-overdue" onclick="openOverdueModal()">
          ⚠️ <span class="btn-text">逾期工作</span> <span id="overdueBadgeCount" class="badge-pill">0</span>
        </button>
        <button class="btn-bubble btn-backlog" onclick="openBacklogModal()">
          📥 <span class="btn-text">未有日期</span> <span id="backlogBadgeCount" class="badge-pill">0</span>
        </button>
        <button class="btn-bubble btn-completed" onclick="openCompletedModal()">
          ✅ <span class="btn-text">已完成</span> <span id="completedBadgeCount" class="badge-pill">0</span>
        </button>
        <button class="btn-bubble" style="background:#f1f5f9; color:#475569; border-color:#cbd5e1;" onclick="openArchivedModal()">
          📦 <span class="btn-text">典藏庫</span> <span id="archivedBadgeCount" class="badge-pill">0</span>
        </button>
        <!-- 向上箭嘴按鈕 -->
        <button class="today-btn" onclick="scrollToToday()" title="回今天">⬆️</button>
      </div>
    </div>

    <!-- ⚡ Rapid Logging 快速輸入區 (兩行佈局) -->
    <form class="quick-input-card" onsubmit="handleQuickSubmit(event)">
      <!-- 第一行：類別 + 輸入內容 -->
      <div class="quick-input-row">
        <select id="quickType">
          <option value="Task">•</option>
          <option value="Event">o</option>
          <option value="筆記">-</option>
        </select>
        <input type="text" id="quickContent" placeholder="⚡ 快速記下... (#sch #family)" required>
      </div>
      <!-- 第二行：無日期 Backlog + 新增按鈕 -->
      <div class="quick-input-row" style="justify-content: space-between;">
        <label style="font-size:0.78rem; color:#64748b; display:flex; align-items:center; gap:4px; cursor:pointer;">
          <input type="checkbox" id="quickIsBacklog"> 無日期 (Backlog)
        </label>
        <button type="submit" class="btn-add-quick">新增</button>
      </div>
    </form>

    <div id="statusMessage" style="font-size:0.8rem; color:var(--primary); margin:8px 0 0 0;">⏳ 載入中...</div>

    <!-- 主時間軸容器 -->
    <div id="timelineContainer" class="timeline-container"></div>
  </div>

  <!-- 懸浮新增按鈕 -->
  <button class="fab-btn" onclick="openAddModal()">＋</button>

  <!-- Modals -->
  <div id="overdueModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span>⚠️ 逾期未完成工作 (Overdue)</span>
        <button style="border:none; background:none; cursor:pointer; font-size:1.2rem;" onclick="closeOverdueModal()">✕</button>
      </div>
      <div id="overdueModalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="backlogModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span>📥 未有日期工作 (Backlog)</span>
        <button style="border:none; background:none; cursor:pointer; font-size:1.2rem;" onclick="closeBacklogModal()">✕</button>
      </div>
      <div id="backlogModalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="completedModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span>✅ 已完成工作紀錄 (Completed)</span>
        <button style="border:none; background:none; cursor:pointer; font-size:1.2rem;" onclick="closeCompletedModal()">✕</button>
      </div>
      <div id="completedModalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="archivedModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span>📦 典藏庫 (Archived)</span>
        <button style="border:none; background:none; cursor:pointer; font-size:1.2rem;" onclick="closeArchivedModal()">✕</button>
      </div>
      <div id="archivedModalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="itemModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span id="modalFormTitle">✏️ 編輯事項</span>
        <button style="border:none; background:none; cursor:pointer; font-size:1.2rem;" onclick="closeItemModal()">✕</button>
      </div>
      <form id="itemForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="modalItemId">
        <div style="display:flex; flex-direction:column; gap:8px;">
          <label style="font-size:0.8rem; font-weight:bold;">日期 (留空轉為「未有日期」)：
            <input type="date" id="modalDate" style="width:100%; padding:6px; margin-top:2px;">
          </label>
          <label style="font-size:0.8rem; font-weight:bold;">類型：
            <select id="modalType" style="width:100%; padding:6px; margin-top:2px;" onchange="updateModalButtonsState()">
              <option value="Task">Task (任務)</option>
              <option value="Event">Event (事件)</option>
              <option value="筆記">筆記 (Note)</option>
            </select>
          </label>
          <label style="font-size:0.8rem; font-weight:bold;">內容：
            <input type="text" id="modalContent" required style="width:100%; padding:6px; margin-top:2px;">
          </label>
          <label style="font-size:0.8rem; font-weight:bold;">備註 (Remarks)：
            <textarea id="modalRemarks" rows="2" style="width:100%; padding:6px; margin-top:2px;"></textarea>
          </label>
        </div>
        <div class="modal-actions-bar">
          <div style="display:flex; gap:6px;">
            <button type="button" id="btnDelete" onclick="deleteCurrentItem()" style="background:#fee2e2; color:#ef4444; border:1px solid #fca5a5; padding:6px 10px; border-radius:6px; cursor:pointer; font-weight:bold; display:none;">🗑️ 刪除</button>
            <button type="button" id="btnArchive" onclick="archiveFromModal()" style="background:#f1f5f9; color:#475569; border:1px solid #cbd5e1; padding:6px 10px; border-radius:6px; cursor:pointer; font-weight:bold; display:none;">📦 典藏</button>
          </div>
          <div style="display:flex; gap:6px;">
            <button type="button" id="btnAssignTodayModal" onclick="assignToTodayFromModal()" style="background:#e0f2fe; color:#0284c7; border:1px solid #bae6fd; padding:6px 10px; border-radius:6px; cursor:pointer; font-weight:bold; display:none;">📅 移至今天</button>
            <button type="button" id="btnToggleDoneModal" onclick="toggleDoneFromModal()" style="background:#dcfce7; color:#15803d; border:1px solid #86efac; padding:6px 10px; border-radius:6px; cursor:pointer; font-weight:bold; display:none;">✅ 完成</button>
            <button type="button" onclick="closeItemModal()" style="background:#f1f5f9; border:none; padding:6px 10px; border-radius:6px; cursor:pointer;">取消</button>
            <button type="submit" style="background:var(--primary); color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:bold;">儲存</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" onload="initGoogleSignIn()" async defer></script>
</body>
</html>
