<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚡ 進化版速記時間軸 - Daily Adv</title>
  
  <!-- 設定檔與外部套件 -->
  <script src="config.js"></script>
  <script src="allowed-emails.js"></script>
  <script src="daily_adv.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  
  <style>
    :root {
      --primary: #0284c7;
      --bg-color: #f8fafc;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: #0f172a;
      margin: 0;
      padding: 10px;
    }

    /* 驗證遮罩 */
    .auth-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999; padding: 16px;
    }
    .auth-card {
      background: #fff; border-radius: 16px; width: 100%; max-width: 360px;
      padding: 28px 20px; text-align: center;
    }

    .container {
      max-width: 850px; margin: 0 auto; background: #fff;
      padding: 12px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      display: none;
    }

    /* 頂部導覽 */
    .nav-tabs { display: flex; gap: 6px; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; margin-bottom: 10px; }
    .nav-btn { padding: 6px 12px; font-size: 0.82rem; border-radius: 6px; text-decoration: none; background: #e2e8f0; color: #475569; font-weight: bold; }
    .nav-btn.active { background: var(--primary); color: #fff; }

    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color);
    }
    .title-group { font-size: 1.1rem; font-weight: bold; color: var(--primary); }

    /* 頂部 Bubble 氣泡按鈕區 */
    .top-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    
    .btn-bubble {
      border-radius: 20px; padding: 6px 12px; font-size: 0.8rem; font-weight: bold;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent;
      transition: all 0.2s;
    }
    .btn-bubble:hover { opacity: 0.85; transform: translateY(-1px); }

    .btn-backlog { background: #f3e8ff; color: #7e22ce; border-color: #d8b4fe; }
    .btn-overdue { background: #fef2f2; color: #991b1b; border-color: #fca5a5; }
    .btn-completed { background: #f0fdf4; color: #166534; border-color: #86efac; }
    .today-btn { background: var(--primary); color: #fff; border: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }

    .badge-pill {
      background: rgba(0,0,0,0.15); color: inherit; padding: 1px 7px;
      border-radius: 10px; font-size: 0.72rem;
    }

    /* 時間軸 (Timeline Layout) */
    .timeline-container { display: flex; flex-direction: column; gap: 16px; margin-top: 14px; }

    .day-block { display: flex; gap: 12px; position: relative; }
    .day-date-col { width: 50px; flex-shrink: 0; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .day-weekday { font-size: 0.7rem; font-weight: bold; color: #64748b; text-transform: uppercase; }
    .day-number {
      font-size: 1.2rem; font-weight: bold; width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center; border-radius: 50%;
      margin-top: 2px; color: #334155;
    }
    .day-block.is-today .day-number { background: var(--primary); color: #fff; }
    .day-block.is-today .day-weekday { color: var(--primary); }

    .day-content-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }

    .pending-tasks-pill {
      background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 12px;
      padding: 3px 10px; font-size: 0.75rem; color: #475569; font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px; width: fit-content;
    }

    .task-card {
      background: #38bdf8; color: #fff; border-radius: 8px; padding: 8px 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .task-card.type-Event { background: #0284c7; }
    .task-card.type-Task { background: #2563eb; }
    .task-card.type-Note { background: #64748b; }

    .task-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .task-title { font-weight: bold; font-size: 0.88rem; line-height: 1.3; word-break: break-word; }
    .task-remarks { font-size: 0.75rem; opacity: 0.9; margin-top: 2px; }

    .task-actions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
    .btn-circle {
      width: 26px; height: 26px; border-radius: 50%; border: none; background: rgba(255,255,255,0.25);
      color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8rem;
    }
    .btn-circle:hover { background: rgba(255,255,255,0.4); }

    /* Modal 對話框共用樣式 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center;
      z-index: 1000; padding: 12px;
    }
    .modal-card { background: #fff; border-radius: 14px; width: 100%; max-width: 460px; padding: 16px; max-height: 85vh; display: flex; flex-direction: column; }
    .modal-header { font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .modal-body { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

    /* 懸浮新增按鈕 */
    .fab-btn {
      position: fixed; bottom: 20px; right: 20px; width: 52px; height: 52px;
      border-radius: 50%; background: var(--primary); color: #fff; font-size: 1.5rem;
      border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer;
      display: flex; align-items: center; justify-content: center; z-index: 900;
    }
  </style>
</head>
<body>

  <!-- Google 登入驗證 -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
      <h3 style="margin-top:0;">⚡ 速記清單 Adv</h3>
      <p style="color:#64748b; font-size:0.85rem;">請先驗證 Google 帳號</p>
      <div id="googleSignInContainer" style="display:flex; justify-content:center; min-height:40px;"></div>
    </div>
  </div>

  <div class="container" id="mainContainer">
    <div id="navbar" class="nav-tabs"></div>

    <div class="header-bar">
      <div class="title-group">⚡ 每日事項時間軸</div>
      <div class="top-actions">
        <button class="btn-bubble btn-overdue" onclick="openOverdueModal()">
          ⚠️ 逾期工作 <span id="overdueBadgeCount" class="badge-pill">0</span>
        </button>
        <button class="btn-bubble btn-backlog" onclick="openBacklogModal()">
          📥 未有日期 <span id="backlogBadgeCount" class="badge-pill">0</span>
        </button>
        <button class="btn-bubble btn-completed" onclick="openCompletedModal()">
          ✅ 已完成 <span id="completedBadgeCount" class="badge-pill">0</span>
        </button>
        <button class="btn-bubble" style="background:#f1f5f9; color:#475569; border-color:#cbd5e1;" onclick="openArchivedModal()">
          📦 典藏庫 <span id="archivedBadgeCount" class="badge-pill">0</span>
        </button>
        <button class="today-btn" onclick="scrollToToday()">回今天</button>
      </div>
    </div>

    <div id="statusMessage" style="font-size:0.8rem; color:var(--primary); margin:8px 0 0 0;">⏳ 載入中...</div>

    <!-- 主時間軸容器 -->
    <div id="timelineContainer" class="timeline-container"></div>
  </div>

  <!-- 懸浮新增按鈕 -->
  <button class="fab-btn" onclick="openAddModal()">＋</button>

  <!-- 1. ⚠️ 逾期工作 Modal 對話框 -->
  <div id="overdueModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span>⚠️ 逾期未完成工作 (Overdue)</span>
        <button style="border:none; background:none; cursor:pointer; font-size:1.2rem;" onclick="closeOverdueModal()">✕</button>
      </div>
      <div id="overdueModalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- 2. 📥 未有日期工作 (Backlog) Modal 對話框 -->
  <div id="backlogModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span>📥 未有日期工作 (Backlog)</span>
        <button style="border:none; background:none; cursor:pointer; font-size:1.2rem;" onclick="closeBacklogModal()">✕</button>
      </div>
      <div id="backlogModalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- 3. ✅ 已完成工作 Modal 對話框 -->
  <div id="completedModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span>✅ 已完成工作紀錄 (Completed)</span>
        <button style="border:none; background:none; cursor:pointer; font-size:1.2rem;" onclick="closeCompletedModal()">✕</button>
      </div>
      <div id="completedModalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- 4. 📦 典藏庫 Modal 對話框 -->
  <div id="archivedModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span>📦 典藏庫 (Archived)</span>
        <button style="border:none; background:none; cursor:pointer; font-size:1.2rem;" onclick="closeArchivedModal()">✕</button>
      </div>
      <div id="archivedModalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- 5. ✏️ 新增 / 編輯事項 Modal 對話框 -->
  <div id="itemModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span id="modalFormTitle">✏️ 編輯事項</span>
        <button style="border:none; background:none; cursor:pointer; font-size:1.2rem;" onclick="closeItemModal()">✕</button>
      </div>
      <form id="itemForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="modalItemId">
        <div style="display:flex; flex-direction:column; gap:8px;">
          <label style="font-size:0.8rem; font-weight:bold;">日期 (留空轉為「未有日期」)：
            <input type="date" id="modalDate" style="width:100%; padding:6px; margin-top:2px;">
          </label>
          <label style="font-size:0.8rem; font-weight:bold;">類型：
            <select id="modalType" style="width:100%; padding:6px; margin-top:2px;">
              <option value="Task">Task (任務)</option>
              <option value="Event">Event (事件)</option>
              <option value="筆記">筆記 (Note)</option>
            </select>
          </label>
          <label style="font-size:0.8rem; font-weight:bold;">內容：
            <input type="text" id="modalContent" required style="width:100%; padding:6px; margin-top:2px;">
          </label>
          <label style="font-size:0.8rem; font-weight:bold;">備註 (Remarks)：
            <textarea id="modalRemarks" rows="2" style="width:100%; padding:6px; margin-top:2px;"></textarea>
          </label>
        </div>
        <div class="modal-actions">
          <button type="button" id="btnDelete" onclick="deleteCurrentItem()" style="background:#fee2e2; color:#ef4444; border:1px solid #fca5a5; padding:6px 12px; border-radius:6px; cursor:pointer; margin-right:auto; display:none;">🗑️ 刪除</button>
          <button type="button" onclick="closeItemModal()" style="background:#f1f5f9; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">取消</button>
          <button type="submit" style="background:var(--primary); color:#fff; border:none; padding:6px 14px; border-radius:6px; cursor:pointer; font-weight:bold;">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" onload="initGoogleSignIn()" async defer></script>
</body>
</html>
