<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends’ memo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 頂部導覽列 -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-700 flex items-center gap-2">
                <i class="fa-solid fa-address-book text-yellow-500"></i> Friends’ memo
            </h1>
            <div class="flex items-center gap-3 w-1/2 md:w-1/3">
                <input type="text" id="searchInput" placeholder="搜尋朋友名字或內容..." class="w-full px-4 py-2 border rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400">
                <button id="openSettingsBtn" class="text-gray-500 hover:text-yellow-600 p-2 transition" title="設定 GAS 網址">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">
        <!-- 新增筆記區塊 -->
        <div class="bg-white rounded-xl shadow-md p-4 mb-6 max-w-lg mx-auto border border-gray-100">
            <input type="text" id="noteTitle" placeholder="朋友名字（例如：阿明）" class="w-full px-3 py-2 font-semibold text-gray-800 focus:outline-none mb-2 border-b border-gray-100">
            <textarea id="noteContent" rows="3" placeholder="記錄需求、生日、喜好... (貼上網址會自動生成預覽，輸入 #標籤)" class="w-full px-3 py-2 text-gray-600 focus:outline-none resize-none text-sm"></textarea>
            <div class="flex justify-end items-center mt-2 pt-2 border-t border-gray-100">
                <button id="addNoteBtn" class="bg-yellow-500 hover:bg-yellow-600 text-white px-5 py-2 rounded-lg font-medium text-sm transition shadow-sm">
                    新增筆記
                </button>
            </div>
        </div>

        <!-- 標籤篩選列 -->
        <div id="tagFilterBar" class="flex gap-2 overflow-x-auto pb-3 mb-4 items-center">
            <button class="tag-filter-all px-3 py-1 bg-gray-800 text-white rounded-full text-xs font-medium transition whitespace-nowrap">全部標籤</button>
        </div>

        <!-- 筆記卡片網格 -->
        <div id="notesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- 動態載入 -->
        </div>
    </main>

    <!-- GAS 設定互動視窗 (Modal) -->
    <div id="settingsModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-gray-800 text-lg"><i class="fa-solid fa-database text-yellow-500"></i> 設定 Google Sheets 連結</h3>
                <button id="closeSettingsBtn" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-xs text-gray-500 mb-4">請輸入你的 Google Apps Script 網頁應用程式網址。資料將直接同步至你的 Google Sheet。</p>
            <input type="text" id="gasUrlInput" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3 py-2 border rounded-lg text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-yellow-400">
            <div class="flex justify-end gap-2">
                <button id="saveSettingsBtn" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">儲存並連線</button>
            </div>
        </div>
    </div>

    <!-- 載入外部 JS -->
    <script src="friends_memo.js"></script>
</body>
</html>
